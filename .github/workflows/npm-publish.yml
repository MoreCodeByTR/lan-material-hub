name: Publish to npm

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_name="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          tag_version="${tag_name#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match release tag ($tag_name)."
            exit 1
          fi

      - name: Build package
        run: npm run build

      - name: Check npm version
        id: npm-version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$package_name@$package_version is not published yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack dry run
        if: steps.npm-version.outputs.published == 'false'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm-version.outputs.published == 'false'
        run: npm publish --provenance --access public
